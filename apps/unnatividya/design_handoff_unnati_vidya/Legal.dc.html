<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=block" rel="stylesheet">
<style>body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#16133F;-webkit-font-smoothing:antialiased}*{box-sizing:border-box}a{color:#5B4CF0;text-decoration:none}a:hover{color:#4A3BDB;text-decoration:underline}</style>
</helmet>
<div data-screen-label="Legal" style="min-height:100vh;display:flex;flex-direction:column;background:#fff">
<dc-import name="UVHeader" active="" hint-size="100%,68px" style="position:sticky;top:0;z-index:40;display:block"></dc-import>
<section style="background:linear-gradient(180deg,#F7F5FF,#FBFAFF);border-bottom:1px solid #EEECF8">
  <div style="max-width:980px;margin:0 auto;padding:28px clamp(16px,3vw,32px) 0">
    <div style="font-size:13px;color:#6F6D8C;display:flex;gap:6px;align-items:center"><a href="Home.dc.html">Home</a><span style="font-family:'Material Symbols Rounded';font-size:16px">chevron_right</span><span style="color:#16133F">{{ title }}</span></div>
    <h1 style="margin:14px 0 0;font-size:clamp(30px,4.2vw,44px);letter-spacing:-0.035em;font-weight:800">{{ title }}</h1>
    <div style="font-size:13px;color:#6F6D8C;margin-top:6px">Last updated October 2026</div>
    <div style="display:flex;gap:24px;margin-top:20px;overflow-x:auto"><sc-for list="{{ tabs }}" as="t" hint-placeholder-count="3"><div onClick="{{ t.go }}" style="cursor:pointer;white-space:nowrap;padding:12px 0;font-weight:700;font-size:14px;color:{{ t.c }};border-bottom:2px solid {{ t.bd }}">{{ t.label }}</div></sc-for></div>
  </div>
</section>
<main style="flex:1;max-width:980px;width:100%;margin:0 auto;padding:32px clamp(16px,3vw,32px) 0;display:flex;flex-wrap:wrap;gap:32px;align-items:flex-start">
  <nav style="flex:1 1 200px;max-width:240px;position:sticky;top:92px;display:flex;flex-direction:column;gap:4px;font-size:14px">
    <sc-for list="{{ sections }}" as="s" hint-placeholder-count="5"><div onClick="{{ s.go }}" style="cursor:pointer;padding:6px 0;color:#4A4867;font-weight:600" style-hover="color:#5B4CF0">{{ s.h }}</div></sc-for>
  </nav>
  <div style="flex:999 1 480px;min-width:0">
    <sc-for list="{{ sections }}" as="s" hint-placeholder-count="5">
      <section id="{{ s.id }}" style="margin-bottom:32px"><h2 style="margin:0;font-size:20px;font-weight:800">{{ s.h }}</h2><p style="margin:10px 0 0;font-size:15px;line-height:1.75;color:#2B2950">{{ s.p }}</p></section>
    </sc-for>
    <div style="padding:18px;border-radius:14px;background:#F8F7FD;font-size:14px;color:#4A4867">Questions about this policy? Call <a href="tel:18001204050" style="font-weight:700">1800-120-4050</a>.</div>
  </div>
</main>
<dc-import name="UVFooter" hint-size="100%,360px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { tab: 'privacy' };
  componentDidMount() { try { const t = new URLSearchParams(location.search).get('tab'); if (t) this.setState({ tab: t }); } catch (e) {} }
  renderVals() {
    const D = {
      privacy: ['Privacy policy', [['What we collect', 'Contact details you submit (name, mobile, email), course preferences, and basic usage data such as pages visited.'], ['How we use it', 'To respond to your enquiry, share program information, and connect you with the university you choose.'], ['Who we share it with', 'Only the university or loan partner relevant to your enquiry, and service providers who help us operate the site.'], ['Your choices', 'You can ask us to stop contacting you or delete your data at any time by calling us.'], ['Your shortlist', 'Saved programs and comparisons are stored on your device, not on our servers.']]],
      terms: ['Terms of use', [['Using the site', 'Unnati Vidya provides information to help you compare online degrees. It is not an offer of admission.'], ['Accuracy', 'We verify data against official sources each cycle, but universities can change fees and rules. Confirm details before applying.'], ['Enquiries', 'Submitting an enquiry does not confirm university admission.'], ['Third-party links', 'Links to university and partner sites are governed by their own terms.'], ['Changes', 'We may update these terms; the date above shows the latest version.']]],
      refund: ['Refund policy', [['Our services are free', 'Counselling and comparison are free, so there is nothing to refund from Unnati Vidya.'], ['University fees', 'Fees paid to a university are refunded according to that university’s own refund policy.'], ['Application fees', 'Application fees are usually non-refundable. Check with the university before paying.'], ['Loans & EMI', 'Cancellation of a loan or EMI plan is governed by the lender’s terms.'], ['Need help?', 'We can help you raise a refund request with the university.']]]
    };
    const [title, secs] = D[this.state.tab] || D.privacy;
    return { title,
      tabs: [['privacy', 'Privacy'], ['terms', 'Terms'], ['refund', 'Refund policy']].map(([k, label]) => ({ label, go: () => this.setState({ tab: k }), c: this.state.tab === k ? '#5B4CF0' : '#4A4867', bd: this.state.tab === k ? '#5B4CF0' : 'transparent' })),
      sections: secs.map(([h, p], i) => ({ h, p, id: 'l' + i, go: () => { const el = document.getElementById('l' + i); if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 90, behavior: 'smooth' }); } })) };
  }
}
</script>
</body>
</html>
