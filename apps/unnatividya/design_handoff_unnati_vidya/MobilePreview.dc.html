<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>body{margin:0;background:#EEECF5;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#16133F}a{color:#5B4CF0;text-decoration:none}a:hover{color:#4A3BDB;text-decoration:underline}</style>
</helmet>
<div style="padding:48px;display:flex;flex-direction:column;gap:28px">
  <div>
    <div style="font-size:13px;font-weight:700;letter-spacing:0.06em;color:#5B4CF0">UNNATI VIDYA REDESIGN</div>
    <h1 style="margin:6px 0 0;font-size:36px;letter-spacing:-0.03em;font-weight:800">Mobile — all page types</h1>
    <p style="margin:6px 0 0;color:#4A4867">Each phone is the live responsive page at 390px. Scroll inside a phone; click a title to open the desktop page.</p>
  </div>
  <div style="display:flex;flex-wrap:wrap;gap:40px">
    <sc-for list="{{ pages }}" as="p" hint-placeholder-count="6">
      <div style="display:flex;flex-direction:column;gap:12px">
        <a href="{{ p.src }}" style="font-weight:800;font-size:15px;color:#16133F;display:flex;gap:8px;align-items:center"><span style="font-size:12px;color:#fff;background:#5B4CF0;border-radius:6px;padding:2px 7px">{{ p.n }}</span>{{ p.label }}</a>
        <div style="width:414px;height:868px;border-radius:52px;background:#16133F;padding:12px;box-shadow:0 30px 60px -30px rgba(22,19,63,0.6)">
          <div style="width:390px;height:844px;border-radius:40px;overflow:hidden;background:#fff;position:relative">
            <iframe src="{{ p.src }}" title="{{ p.label }}" loading="lazy" style="width:390px;height:844px;border:0;display:block"></iframe>
          </div>
        </div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const P = [['Home', 'Home.dc.html'], ['Courses listing', 'Courses.dc.html'], ['Course detail', 'Course.dc.html?id=mba-muj'], ['Universities', 'Universities.dc.html'], ['University detail', 'University.dc.html?id=muj'], ['Compare', 'Compare.dc.html?ids=mba-muj,mba-smu,mba-amity'], ['Find my fit — quiz', 'Recommender.dc.html'], ['Find my fit — results', 'Recommender.dc.html?results=1'], ['Specializations', 'Specializations.dc.html'], ['Specialization detail', 'Specialization.dc.html?key=mba-finance'], ['Guides', 'Guides.dc.html'], ['Guide article', 'Article.dc.html?slug=mba-fees'], ['EMI calculator', 'EMICalculator.dc.html'], ['Shortlist', 'Shortlist.dc.html'], ['Apply now', 'Apply.dc.html'], ['About', 'About.dc.html'], ['How we verify', 'HowWeVerify.dc.html'], ['Legal', 'Legal.dc.html?tab=privacy']];
    return { pages: P.map(([label, src], i) => ({ label, src, n: String(i + 1).padStart(2, '0') })) };
  }
}
</script>
</body>
</html>
